[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wtfport"
dynamic = ["version"]
description = "Find out what's using a port, then inspect, kill, or watch it"
readme = "README.md"
authors = [
  { name="Hungwa Henry" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ports", "network", "cli", "lsof", "netstat", "process"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Networking",
  "Topic :: Utilities"
]
requires-python = ">=3.10"
dependencies = [
  "typer>=0.16",
  "rich>=13.8",
  "psutil>=5.9"
]

[project.urls]
Homepage = "https://github.com/hungwahenry/wtfport"
Issues = "https://github.com/hungwahenry/wtfport/issues"
Changelog = "https://github.com/hungwahenry/wtfport/blob/main/CHANGELOG.md"

[project.scripts]
wtfport = "wtfport.cli:app"

[dependency-groups]
dev = ["build", "mypy", "pytest", "ruff", "twine", "types-psutil"]

[tool.setuptools.dynamic]
version = { attr = "wtfport.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wtfport = ["notify.ps1", "py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PTH", "RET", "RUF", "SIM", "UP", "W"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
