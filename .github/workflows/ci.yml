name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy --platform linux
      - run: mypy --platform darwin
      - run: mypy --platform win32

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      - run: pytest

  # The oldest dependency versions pyproject.toml allows
  minimum-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.10
      - run: uv pip install --resolution lowest-direct -e .
      - run: uv pip install pytest
      - run: .venv/bin/pytest

  # Install the built wheel into a clean environment: what users actually get
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/wtfport --version
          /tmp/wheel-env/bin/wtfport --all --json
          /tmp/wheel-env/bin/python -m wtfport --debug
